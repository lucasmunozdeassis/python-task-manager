<!DOCTYPE html>
<html>
<head>
    <title>Lista de tarefas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>
        Lista de tarefas
    </h1>
    <a href="{{ url_for('criar') }}">
        <button type="button">Criar Nova Tarefa</button>
    </a>
    <ul>
        
    {% for tarefa in tarefas %}
    <li>---------------------------------------------------------------------------------------------------------------------------------------------</li>    
    <li>
            <strong>{{ tarefa.titulo }}</strong> <strong>→</strong> <strong>{{ tarefa.status }}</strong>
            <li></li>

            <form action="{{ url_for('concluir') }}" method="post" style="display:inline;">
                <input type="hidden" name="titulo" value="{{ tarefa.titulo }}">
                <button type="submit">concluir</button>
            </form>
            <form action="{{ url_for('desconcluir') }}" method="post" style="display:inline;">
                <input type="hidden" name="titulo" value="{{ tarefa.titulo }}">
                <button type="submit">não concluído</button>
            </form>
            <form action="{{ url_for('deletar') }}" method="post" style="display:inline;">
                <input type="hidden" name="titulo" value="{{ tarefa.titulo }}">
                <button type="submit">Apagar</button>
            </form>
            <li></li>
        </li>
    {% endfor %}
</ul>
</ul>
</body>
</html>
